name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Lint, TypeCheck, Unit Tests, Build
  test:
    runs-on: ubuntu-latest
    name: Lint, TypeCheck, Unit Tests & Build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoria_prograd_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monitoria_prograd_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monitoria_prograd_qa
      PROGRAD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monitoria_prograd_qa
      CAS_SERVER_URL_PREFIX: https://autenticacao.ufba.br/ca
      SERVER_URL: http://localhost:3000/api
      CLIENT_URL: http://localhost:3000
      NODE_ENV: test
      PORT: "3000"
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: sistema-de-monitoria-test
      JWT_SECRET: build-test-jwt-secret-32-char-minimum-length-required-here
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Install PDF text extraction tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Prepare integration database
        run: npm run db:push -- --force

      - name: Test PostgreSQL and PDF integration
        run: npm run test:prograd

      - name: Build application
        run: npm run build
