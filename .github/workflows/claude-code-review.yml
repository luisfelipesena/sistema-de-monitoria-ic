name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'


      - name: Diagnose review failure without exposing credentials
        if: failure()
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ.get("CLAUDE_EXECUTION_FILE") or Path(os.environ["RUNNER_TEMP"]) / "claude-execution-output.json")
          if not path.exists():
              print("Claude execution output is unavailable")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          records = data if isinstance(data, list) else data.get("messages", [data])
          results = [record for record in records if record.get("type") == "result"]
          text = json.dumps(results).lower()
          categories = {
              "authentication": ["oauth", "unauthorized", "invalid api key", "authentication", "please run /login", "not logged in"],
              "billing": ["credit balance", "insufficient credits", "billing"],
              "rate_limit": ["rate limit", "rate_limit", "usage limit"],
              "model": ["model not found", "model_not_found", "invalid model", "not_found_error", "does not exist", "not have access to model"],
              "permissions": ["permission denied", "resource not accessible"],
          }
          print(json.dumps({"result_count": len(results), "failure_categories": [name for name, patterns in categories.items() if any(pattern in text for pattern in patterns)]}))
          PY
